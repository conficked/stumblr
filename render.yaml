previews:
  generation: "off"

services:
  - type: web
    name: stumblr-private-preview
    runtime: docker
    plan: starter
    region: oregon
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    domains:
      - stumblr.dev
    envVars:
      - key: STUMBLR_DB_PATH
        value: /var/data/stumblr-ops.sqlite
      - key: STUMBLR_EXPECTED_ORIGIN
        value: https://stumblr.dev
      - key: STUMBLR_ACCESS_MODE
        value: public
    disk:
      name: stumblr-data
      mountPath: /var/data
      sizeGB: 1
